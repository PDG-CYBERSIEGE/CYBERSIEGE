services:
  postgres:
    image: postgres:16-alpine
    container_name: PDG_postgres
    environment:
      POSTGRES_USER: pdg_user
      POSTGRES_PASSWORD: pdg_password
      POSTGRES_DB: pdg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      #- ./db/init:/docker-entrypoint-initdb.d:Z   TODO a remettre quand on aura une initialisation de notre DB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pdg_user -d pdg" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - battle-network



  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PDG_backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/pdg
      QUARKUS_DATASOURCE_USERNAME: pdg_user
      QUARKUS_DATASOURCE_PASSWORD: pdg_password
    ports:
      - "8080:8080"
    networks:
      - battle-network

volumes:
  pgdata:
    driver: local

networks:
  battle-network:
    driver: bridge



