<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css" />
		<link rel="stylesheet" href="dist/reveal.css" />
		<link rel="stylesheet" href="dist/theme/black.css" />

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />

		<style>
			:root {
				--r-main-font-size: 28px;
			}
			.columns {
				display: flex;
				align-items: center;
				gap: 2em;
				text-align: left;
			}
			.columns .col-text {
				flex: 1;
			}
			.columns .col-img {
				flex: 1;
				text-align: center;
			}
			.columns .col-img img {
				max-width: 100%;
				max-height: 60vh;
				border: none;
				box-shadow: none;
				background: none;
			}
			.columns.compact {
				font-size: 0.65em;
			}
			.columns.compact li {
				margin-bottom: 0.3em;
			}
			.full-slide-img {
				width: 100%;
				height: 100%;
				object-fit: contain; /* ou "cover" */
			}

			/* variante colonnes inégales : ajouter class="wide" ou "narrow" */
			.columns .col-text.wide, .columns .col-img.wide { flex: 1.5; }
			.columns .col-text.narrow, .columns .col-img.narrow { flex: 0.7; }
		</style>
	</head>
	<body>

	<div class="reveal">
		<div class="slides">
			<section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$" data-separator-notes="^Note:">
				<script type="text/template">
					# Projet de groupe — HEIG-VD
					## CYBERSIEGE

					---

					<!-- .slide: data-background-color="#1a1a2e" -->
					# Problématique

					--

					## Le problème

					Les autres jeux de destruction de structure (genre Angry Birds) :
					- niveaux prédéfinis
					- solo
					- stratégie limitée

					**Créer sa propre structure et la confronter à celle d'un autre joueur ?**

					**PAS POSSIBLE !**

					---

					<!-- .slide: data-background-color="#16213e" -->
					# La solution

					--

					## CYBERSIEGE

					Jeux de destruction de structure **1 vs 1 en ligne**

					Construire → Attaquer → Détruire

					**Votre stratégie contre celle de l'adversaire**

					**En plusieurs manches !**

					--

					## Phase 1 — Construction

					- Obtention des blocs
					- Placement des blocs et du roi
					- Test de la structure
					- Validation côté serveur
					- Passage à la bataille

					--

					## Phase 2 — Bataille

					- Choix du robot, de la puissance et de l'angle
					- Tirs vers la structure adverse
					- Physique et dégâts selon les collisions
					- Destruction des blocs et du roi
					- Validation des tirs côté serveur
					- Victoire : roi adverse détruit

					--

					## Compte & matchmaking

					- Gestion de compte : email, username, mot de passe
					- Matchmaking : file d'attente pour trouver un adversaire 1v1

					---

					<!-- .slide: data-background-color="#0f3460" -->
					# Processus de travail

					--

					## Méthodologie

					- Approche **agile**
					- Sprints de **3 jours**
					- Kanban : backlog → tâches → suivi
					- User stories pour définir les features du backlog
					- GitHub + Pull Requests

					--

					## Gestion du code source

					- Git Flow
						- dev → intégration
						- main → versions validées
					- Une branche par feature/correction
					- Pull Request + revue de code
					- Aucun push direct sur dev / main
					- ≥ 1 commit/jour/membre

					---

					<!-- .slide: data-background-color="#0f3460" -->
					# Pipeline DevOps

					--

					## Vue d'ensemble

					<div class="columns compact">
						<div class="col-text">
							<ul>
								<li><strong>Frontend</strong> : rendu et exécution du jeu côté client</li>
								<li><strong>Backend</strong> : source unique de vérité, persistance, authentification</li>
								<li><strong>Base de données relationnelle</strong> : comptes utilisateurs, données de jeu</li>
								<li><strong>ORM</strong> : résolution de l'impedance mismatch</li>
								<li><strong>CI/CD</strong> : automatisation tests &amp; déploiement</li>
							</ul>
						</div>
						<div class="col-img">
							<img src="image/Architecture.png" alt="Architecture">
						</div>
					</div>

					--

					## Stack technique (Java)

					| Composant | Choix |
					|---|---|
					| Frontend / rendu jeu | **LibGDX** |
					| Backend | **Quarkus** |
					| Base de données | **PostgreSQL** |
					| ORM | **Hibernate** |
					| Versioning | **GitHub** |
					| Pipeline CI/CD | **Github actions** |
					| Tests | **JUnit** |
					| Coverage | **Jacoco** |
					| Conteneurisation | **Docker / Docker Compose** |

					--

					## Communication client-serveur

					- **HTTP** pour les opérations CRUD
					- **WebSocket** pour le jeu
					- Le serveur reste l'unique source de vérité et renvoie l'état
					de ses calculs pour corriger le client si nécessaire

					--

					## Étapes du pipeline

					1. Push / Pull Request sur `dev` ou `main`
					2. Build du backend (Quarkus) et du frontend (LibGDX) à l'aide de gradle
					3. Vérification formatage/documentation
					3. Exécution des tests unitaires (JUnit)
					4. Analyse de couverture (Jacoco)
					5. Build des images Docker et enregistrement sur le repository

					--

					## Démonstration

					---

					# Merci !

					Questions ?

				</script>
			</section>
		</div>
	</div>

		<script src="dist/reveal.js"></script>
		<script src="dist/plugin/notes.js"></script>
		<script src="dist/plugin/markdown.js"></script>
		<script src="dist/plugin/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
			});
		</script>
	</body>
</html>
