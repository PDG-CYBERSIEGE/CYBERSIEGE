%prod.quarkus.datasource.db-kind = postgresql
%prod.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/cybersiege
%prod.quarkus.datasource.username = pdg_user
%prod.quarkus.datasource.password = pdg_password
%prod.quarkus.datasource.jdbc.max-size = 16

%dev.quarkus.datasource.db-kind = postgresql
%dev.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/cybersiege_dev
%dev.quarkus.datasource.username = pdg_user
%dev.quarkus.datasource.password = pdg_password
%dev.quarkus.datasource.jdbc.max-size = 8

%test.quarkus.datasource.db-kind = postgresql


# Hibernate ORM
quarkus.hibernate-orm.database.generation = update
quarkus.hibernate-orm.log.sql = false
quarkus.hibernate-orm.sql-load-script = import.sql

# JWT Configuration
mp.jwt.verify.issuer = https://cybersiege.com
mp.jwt.verify.publickey.location = publicKey.pem
smallrye.jwt.sign.key.location = privateKey.pem
smallrye.jwt.expire.upTo = 3600

# Quarkus Application Settings
quarkus.application.name = cybersiege-server
quarkus.application.version = 1.0.0
quarkus.http.port = 8080
quarkus.log.level = INFO

# CORS Configuration
quarkus.http.cors.enabled = true
quarkus.http.cors.origins = *
quarkus.http.cors.methods = GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers = Content-Type,Authorization
